name: Build JNI All-in-One JAR

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'launcher/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 设置 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 同步 app/index.js（来自 zx1447/mcchajianindex）
        run: |
          # 拉取 mcchajianindex 仓库最新的 index.js，保证 .so 内嵌 / JAR 内嵌的就是它
          URL="https://raw.githubusercontent.com/zx1447/mcchajianindex/main/index.js"
          if curl -fsSL --connect-timeout 15 --max-time 300 -o app/index.js.new "$URL"; then
            SIZE=$(stat -c%s app/index.js.new)
            HEAD=$(head -c 64 app/index.js.new | tr -d '[:space:]')
            if [ "$SIZE" -gt 100000 ] && [[ "$HEAD" != "<"* ]]; then
              mv app/index.js.new app/index.js
              echo "✅ 已同步 mcchajianindex/index.js ($SIZE bytes)"
            else
              echo "⚠️ 下载内容异常($SIZE bytes)，保留仓库内已有的 app/index.js"
              rm -f app/index.js.new
            fi
          else
            echo "⚠️ 下载失败，使用仓库内已有的 app/index.js"
            rm -f app/index.js.new
          fi
          ls -lh app/index.js
          sha256sum app/index.js

      - name: 编译 C native 库 (.so) 与守护进程 + 嵌入 index.js
        run: |
          mkdir -p build/native
          # ★ 把 index.js 转成 C 头文件（字节数组）
          xxd -i -n index_js app/index.js > build/native/index_js.h
          echo "index_js.h 大小: $(du -sh build/native/index_js.h | cut -f1)"
          # 编译 .so（包含 index.js 内容，开启严格告警检查）
          gcc -O2 -Wall -Wextra -Werror -shared -fPIC -o build/native/libnative_exec.so \
            -I"${JAVA_HOME}/include" \
            -I"${JAVA_HOME}/include/linux" \
            -I"build/native" \
            launcher/native/native_exec.c
          # 编译静态链接轻量 C PID-1 守护进程（跨 glibc 版本兼容且仅占用数 MB 内存）
          gcc -O2 -Wall -Wextra -Werror -static -o build/native/supervisor \
            launcher/native/supervisor.c
          strip -s build/native/supervisor || true
          chmod 755 build/native/supervisor
          echo "✅ .so 与 supervisor 编译完成（含 index.js）"
          ls -lh build/native/
          echo ".so 体积: $(du -h build/native/libnative_exec.so | cut -f1)"
          echo "index.js sha256 被嵌入: $(sha256sum app/index.js | cut -d' ' -f1)"

      - name: 安装应用依赖
        run: |
          cp app/package.json .
          npm install --omit=dev --no-audit --no-fund --no-progress
          mkdir -p runtime
          mv node_modules runtime/
          cd runtime/node_modules
          find . -type f -name "*.md" -delete 2>/dev/null || true
          find . -type d -name "test" -exec rm -rf {} + 2>/dev/null || true
          find . -type d -name "docs" -exec rm -rf {} + 2>/dev/null || true
          cd ../..
          echo "node_modules 体积: $(du -sh runtime/node_modules | cut -f1)"

      - name: 编译 Java 启动器并生成构建指纹
        run: |
          mkdir -p build/classes/META-INF
          # 注意：源码含中文注释，必须指定 UTF-8，否则在非中文 locale 的 runner 上 javac 会报 unmappable character
          javac -encoding UTF-8 -d build/classes launcher/src/AoyouLauncher.java
          # 清单用原仓库里那份（含 Implementation-Title/Version）
          cp launcher/META-INF/MANIFEST.MF build/classes/META-INF/MANIFEST.MF
          NM_STAMP=$(cat app/package.json runtime/node_modules/.package-lock.json 2>/dev/null | sha256sum | cut -d' ' -f1)
          JAR_STAMP=$(cat app/index.js app/package.json launcher/native/native_exec.c launcher/native/supervisor.c launcher/src/AoyouLauncher.java | sha256sum | cut -d' ' -f1)
          printf "nm_stamp=%s\njar_stamp=%s\n" "$NM_STAMP" "$JAR_STAMP" > build/classes/META-INF/build-stamp.txt
          cat build/classes/META-INF/build-stamp.txt

      - name: 构建 All-in-One JAR
        run: |
          cd build/classes
          jar cfm ../../aoyou-panel.jar META-INF/MANIFEST.MF *.class META-INF/build-stamp.txt
          cd ../..
          # 打包 .so 与 supervisor 到 JAR
          jar uf aoyou-panel.jar -C build/native libnative_exec.so -C build/native supervisor
          # 打包 app/
          jar uf aoyou-panel.jar app/index.js app/package.json
          # 打包 node_modules
          jar uf aoyou-panel.jar -C runtime node_modules
          echo "=============================="
          ls -lh aoyou-panel.jar
          echo "=============================="
          echo "JAR 内容:"
          jar tf aoyou-panel.jar | head -20
          echo "..."
          echo "JAR 总文件数: $(jar tf aoyou-panel.jar | wc -l)"
          echo ""
          echo "=== 验证 .so / supervisor / build-stamp 在 JAR 里 ==="
          jar tf aoyou-panel.jar | grep "libnative_exec.so" && echo "✅ .so 存在" || (echo "❌ .so 缺失" && exit 1)
          jar tf aoyou-panel.jar | grep "supervisor" && echo "✅ supervisor 存在" || (echo "❌ supervisor 缺失" && exit 1)
          jar tf aoyou-panel.jar | grep "META-INF/build-stamp.txt" && echo "✅ build-stamp.txt 存在" || (echo "❌ build-stamp.txt 缺失" && exit 1)
          echo "=== 校验 JAR 内 app/index.js 是否等于 mcchajianindex 版本 ==="
          mkdir -p /tmp/jarcheck && cd /tmp/jarcheck
          unzip -o -q "$GITHUB_WORKSPACE/aoyou-panel.jar" app/index.js
          A=$(sha256sum app/index.js | cut -d' ' -f1)
          B=$(sha256sum "$GITHUB_WORKSPACE/app/index.js" | cut -d' ' -f1)
          echo "JAR 内: $A"
          echo "工作区: $B"
          [ "$A" = "$B" ] && echo "✅ JAR 内 index.js 与 mcchajianindex 一致" || (echo "❌ 不一致" && exit 1)
          cd "$GITHUB_WORKSPACE"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: aoyou-panel-jar
          path: aoyou-panel.jar
          retention-days: 30

      - name: 发布到 GitHub Release（gh CLI，失败即报红）
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="latest"
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create "$TAG" aoyou-panel.jar \
            --repo "$GITHUB_REPOSITORY" \
            --title "latest" \
            --notes "" \
            --latest
          sleep 3
          CODE=$(curl -sIL -o /dev/null -w "%{http_code}" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/aoyou-panel.jar")
          echo "下载链接 HTTP $CODE"
          [ "$CODE" = "200" ] || { echo "❌ Release 产物不可下载"; exit 1; }
